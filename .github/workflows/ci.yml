name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  test:
    name: Run Rails Minitest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips-dev

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run tests with travel_to & SLA assertions
        env:
          RAILS_ENV: test
        run: |
          bin/rails db:test:prepare
          bin/rails test
